<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 750" width="950" height="750" style="background:#f8f9fa;font-family:'Inter','Noto Sans SC','PingFang SC',sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.04"/>
    </filter>
    <filter id="shadow-sm" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.04"/>
    </filter>
    <linearGradient id="summary-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect x="0" y="0" width="950" height="750" rx="20" fill="#fff" filter="url(#shadow)"/>

  <!-- Title -->
  <line x1="40" y1="45" x2="180" y2="45" stroke="#e5e7eb" stroke-width="2"/>
  <text x="475" y="52" text-anchor="middle" font-size="26" font-weight="800" fill="#111216" letter-spacing="-0.5">Before / After 對比</text>
  <line x1="770" y1="45" x2="910" y2="45" stroke="#e5e7eb" stroke-width="2"/>

  <!-- ============ COMPARISON ROW ============ -->
  <g transform="translate(24, 78)">
    <!-- Left Panel (Before) -->
    <rect x="0" y="0" width="395" height="540" rx="14" fill="#fef2f2"/>
    <rect x="0" y="0" width="395" height="540" rx="14" fill="none" stroke="#fecaca" stroke-width="1"/>

    <!-- Before Header -->
    <rect x="150" y="20" width="95" height="20" rx="4" fill="#fecaca"/>
    <text x="197" y="34" text-anchor="middle" font-size="10" font-weight="700" fill="#dc2626" letter-spacing="1.5">BEFORE</text>
    <text x="197" y="66" text-anchor="middle" font-size="18" font-weight="800" fill="#dc2626" letter-spacing="2">傳統方式</text>
    <text x="197" y="82" text-anchor="middle" font-size="12" fill="#6b7280">LLM → 自訂腳本</text>

    <!-- LLM Box (Before) -->
    <rect x="100" y="100" width="195" height="56" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <text x="197" y="127" text-anchor="middle" font-size="16" font-weight="800" fill="#1e40af">LLM</text>
    <text x="197" y="146" text-anchor="middle" font-size="11" fill="#6b7280">大語言模型</text>

    <!-- Arrow -->
    <line x1="197" y1="156" x2="197" y2="172" stroke="#9ca3af" stroke-width="2"/>
    <polygon points="192,172 202,172 197,178" fill="#9ca3af"/>

    <!-- Middle Box - Problem -->
    <rect x="40" y="190" width="315" height="150" rx="10" fill="#fff1f1" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="197" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">自訂的資料抓取腳本</text>

    <!-- Problems list -->
    <g font-size="11" fill="#991b1b">
      <text x="60" y="236"><tspan fill="#dc2626" font-weight="700">✗</tspan> 難以維護 — 每個API改版都要重寫</text>
      <text x="60" y="256"><tspan fill="#dc2626" font-weight="700">✗</tspan> 沒有標準 — 腳本風格各異，交接困難</text>
      <text x="60" y="276"><tspan fill="#dc2626" font-weight="700">✗</tspan> 每個環境都需要重新手動配置</text>
      <text x="60" y="296"><tspan fill="#dc2626" font-weight="700">✗</tspan> 增加流程本身複雜度</text>
    </g>

    <!-- XXX marks -->
    <text x="197" y="370" text-anchor="middle" font-size="28" fill="#fca5a5">✗ ✗ ✗</text>
  </g>

  <!-- ============ BRIDGE ============ -->
  <g transform="translate(430, 78)">
    <line x1="15" y1="80" x2="15" y2="56" stroke="#22c55e" stroke-width="2"/>
    <polygon points="10,56 20,56 15,50" fill="#22c55e"/>
    <rect x="2" y="90" width="26" height="60" rx="30" fill="#ecfdf5" stroke="#22c55e" stroke-width="2.5" filter="url(#shadow-sm)"/>
    <text x="15" y="108" text-anchor="middle" font-size="9" font-weight="700" fill="#15803d">MCP</text>
    <text x="15" y="122" text-anchor="middle" font-size="9" font-weight="700" fill="#15803d">橋樑</text>
    <line x1="15" y1="150" x2="15" y2="174" stroke="#22c55e" stroke-width="2"/>
    <polygon points="10,174 20,174 15,180" fill="#22c55e"/>
    <line x1="15" y1="180" x2="15" y2="200" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="3,3"/>
    <polygon points="10,200 20,200 15,206" fill="#22c55e"/>
  </g>

  <!-- ============ RIGHT PANEL (After) ============ -->
  <g transform="translate(480, 78)">
    <rect x="0" y="0" width="446" height="540" rx="14" fill="#f0fdf4"/>
    <rect x="0" y="0" width="446" height="540" rx="14" fill="none" stroke="#bbf7d0" stroke-width="1"/>

    <!-- After Header -->
    <rect x="168" y="20" width="110" height="20" rx="4" fill="#bbf7d0"/>
    <text x="223" y="34" text-anchor="middle" font-size="10" font-weight="700" fill="#16a34a" letter-spacing="1.5">AFTER</text>
    <text x="223" y="66" text-anchor="middle" font-size="18" font-weight="800" fill="#16a34a" letter-spacing="2">MCP 架構</text>
    <text x="223" y="82" text-anchor="middle" font-size="12" fill="#6b7280">LLM → MCP → 後端</text>

    <!-- LLM Box (After) -->
    <rect x="125" y="100" width="195" height="56" rx="12" fill="#eff6ff" stroke="#86efac" stroke-width="2"/>
    <text x="223" y="127" text-anchor="middle" font-size="16" font-weight="800" fill="#166534">LLM</text>
    <text x="223" y="146" text-anchor="middle" font-size="11" fill="#6b7280">大語言模型</text>

    <!-- Arrow -->
    <line x1="223" y1="156" x2="223" y2="172" stroke="#22c55e" stroke-width="2"/>
    <polygon points="218,172 228,172 223,178" fill="#22c55e"/>

    <!-- Middle Box - Solution -->
    <rect x="40" y="190" width="365" height="150" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5"/>
    <text x="222" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">MCP Server → 後端服務</text>

    <!-- Solutions list -->
    <g font-size="11" fill="#166534">
      <text x="60" y="236"><tspan fill="#16a34a" font-weight="700">✓</tspan> <tspan font-weight="700">標準化</tspan> — 遵循 MCP 協定，即插即用</text>
      <text x="60" y="256"><tspan fill="#16a34a" font-weight="700">✓</tspan> <tspan font-weight="700">一次開發</tspan> — 所有 AI 平台都能使用</text>
      <text x="60" y="276"><tspan fill="#16a34a" font-weight="700">✓</tspan> <tspan font-weight="700">零配置</tspan> — 部署後自動發現工具</text>
      <text x="60" y="296"><tspan fill="#16a34a" font-weight="700">✓</tspan> <tspan font-weight="700">安全隔離</tspan> — Demo Mode 模擬，零風險</text>
    </g>

    <!-- Connection Items -->
    <!-- Binance -->
    <rect x="40" y="358" width="365" height="44" rx="8" fill="#fff" stroke="#e5e7eb" stroke-width="1.5" filter="url(#shadow-sm)"/>
    <circle cx="62" cy="380" r="5" fill="#3b82f6"/>
    <text x="75" y="375" font-size="12" font-weight="700" fill="#111216">Binance API</text>
    <text x="75" y="392" font-size="10" fill="#9ca3af">即時價格、K線數據</text>
    <rect x="330" y="368" width="55" height="18" rx="4" fill="#dcfce7"/>
    <text x="357" y="381" text-anchor="middle" font-size="8" font-weight="700" fill="#16a34a" letter-spacing="1">MCP</text>

    <!-- CoinGlass -->
    <rect x="40" y="408" width="365" height="44" rx="8" fill="#fff" stroke="#e5e7eb" stroke-width="1.5" filter="url(#shadow-sm)"/>
    <circle cx="62" cy="430" r="5" fill="#10b981"/>
    <text x="75" y="425" font-size="12" font-weight="700" fill="#111216">CoinGlass API</text>
    <text x="75" y="442" font-size="10" fill="#9ca3af">市場情緒、清算數據</text>
    <rect x="330" y="418" width="55" height="18" rx="4" fill="#dcfce7"/>
    <text x="357" y="431" text-anchor="middle" font-size="8" font-weight="700" fill="#16a34a" letter-spacing="1">MCP</text>

    <!-- Database -->
    <rect x="40" y="458" width="365" height="44" rx="8" fill="#fff" stroke="#e5e7eb" stroke-width="1.5" filter="url(#shadow-sm)"/>
    <circle cx="62" cy="480" r="5" fill="#8b5cf6"/>
    <text x="75" y="475" font-size="12" font-weight="700" fill="#111216">資料庫</text>
    <text x="75" y="492" font-size="10" fill="#9ca3af">持久化存儲</text>
    <rect x="330" y="468" width="55" height="18" rx="4" fill="#dcfce7"/>
    <text x="357" y="481" text-anchor="middle" font-size="8" font-weight="700" fill="#16a34a" letter-spacing="1">MCP</text>

    <!-- Final checkmark -->
    <text x="223" y="522" text-anchor="middle" font-size="24" fill="#86efac" font-weight="700">✓ 一勞永逸</text>
  </g>

  <!-- ============ SUMMARY BAR ============ -->
  <rect x="44" y="636" width="862" height="64" rx="12" fill="url(#summary-bg)" stroke="#dbeafe" stroke-width="1"/>
  <text x="78" y="656" font-size="20">💡</text>
  <text x="112" y="654" font-size="13" fill="#374151">
    <tspan font-weight="700" fill="#1e40af">核心轉變：</tspan>
    從「LLM → 自訂腳本」的混亂模式，進化到「LLM → MCP → 後端」的標準化架構。
  </text>
  <text x="112" y="674" font-size="13" fill="#374151">
    MCP 就像 USB，讓所有 AI 模型都能即插即用後端工具，<tspan font-weight="700" fill="#1e40af">一次開發，到處通用</tspan>。
  </text>
</svg>
