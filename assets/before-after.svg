<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9ca3af"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
    </marker>
    <style>
      text { font-family: 'Inter', 'Noto Sans SC', sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Before / After 對比</text>

  <!-- ===== BEFORE (Left) ===== -->
  <rect x="30" y="60" width="260" height="310" rx="16" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="160" y="95" text-anchor="middle" font-size="18" font-weight="700" fill="#ef4444">Before</text>

  <!-- LLM isolated block -->
  <rect x="80" y="130" width="160" height="100" rx="12" fill="rgba(59,130,246,0.1)" stroke="#3b82f6" stroke-width="2"/>
  <text x="160" y="175" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">LLM</text>
  <text x="160" y="200" text-anchor="middle" font-size="13" fill="#6b7280">大語言模型</text>

  <!-- Description -->
  <rect x="70" y="260" width="180" height="60" rx="8" fill="rgba(239,68,68,0.08)" stroke="#fca5a5" stroke-width="1"/>
  <text x="160" y="285" text-anchor="middle" font-size="14" fill="#dc2626">只能聊天，</text>
  <text x="160" y="305" text-anchor="middle" font-size="14" fill="#dc2626">不能做事</text>

  <!-- X icon -->
  <text x="160" y="345" text-anchor="middle" font-size="24" fill="#ef4444">✗</text>

  <!-- ===== MCP Bridge (Center) ===== -->
  <rect x="330" y="170" width="140" height="60" rx="30" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="2"/>
  <text x="400" y="208" text-anchor="middle" font-size="16" font-weight="700" fill="#059669">MCP 橋樑</text>

  <!-- Arrow from Before to Bridge -->
  <line x1="290" y1="200" x2="325" y2="200" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Arrow from Bridge to After -->
  <line x1="475" y1="200" x2="510" y2="200" stroke="#10b981" stroke-width="2" marker-end="url(#arrowhead-green)"/>

  <!-- ===== AFTER (Right) ===== -->
  <rect x="510" y="60" width="260" height="310" rx="16" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="640" y="95" text-anchor="middle" font-size="18" font-weight="700" fill="#10b981">After</text>

  <!-- LLM block -->
  <rect x="550" y="120" width="160" height="80" rx="12" fill="rgba(59,130,246,0.1)" stroke="#3b82f6" stroke-width="2"/>
  <text x="630" y="155" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">LLM</text>
  <text x="630" y="180" text-anchor="middle" font-size="13" fill="#6b7280">大語言模型</text>

  <!-- Binance -->
  <rect x="540" y="240" width="110" height="55" rx="8" fill="rgba(107,114,128,0.1)" stroke="#6b7280" stroke-width="1.5"/>
  <text x="595" y="268" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Binance</text>
  <text x="595" y="285" text-anchor="middle" font-size="11" fill="#6b7280">交易數據</text>

  <!-- CoinGlass -->
  <rect x="670" y="240" width="110" height="55" rx="8" fill="rgba(107,114,128,0.1)" stroke="#6b7280" stroke-width="1.5"/>
  <text x="725" y="268" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">CoinGlass</text>
  <text x="725" y="285" text-anchor="middle" font-size="11" fill="#6b7280">鏈上數據</text>

  <!-- Database -->
  <rect x="605" y="315" width="110" height="55" rx="8" fill="rgba(139,92,246,0.1)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="660" y="343" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">資料庫</text>
  <text x="660" y="360" text-anchor="middle" font-size="11" fill="#6b7280">持久化存儲</text>

  <!-- Connection lines from LLM to external systems -->
  <line x1="630" y1="200" x2="595" y2="238" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowhead-green)"/>
  <line x1="630" y1="200" x2="725" y2="238" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowhead-green)"/>
  <line x1="630" y1="200" x2="660" y2="313" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowhead-green)"/>

  <!-- Checkmark -->
  <text x="640" y="385" text-anchor="middle" font-size="24" fill="#10b981">✓</text>
</svg>
