<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9ca3af"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
    </marker>
    <style>
      text { font-family: 'Inter', 'Noto Sans SC', sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="300" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">一次開發，多端通用</text>

  <!-- ===== Left: AI Clients ===== -->
  <!-- Label -->
  <text x="130" y="55" text-anchor="middle" font-size="13" font-weight="600" fill="#6b7280">AI 客戶端</text>

  <!-- Hermes Agent -->
  <rect x="30" y="70" width="160" height="50" rx="10" fill="rgba(59,130,246,0.1)" stroke="#3b82f6" stroke-width="2"/>
  <text x="110" y="95" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Hermes Agent</text>
  <text x="110" y="112" text-anchor="middle" font-size="11" fill="#6b7280">✓ 已接入</text>

  <!-- Claude Desktop -->
  <rect x="30" y="135" width="160" height="50" rx="10" fill="rgba(59,130,246,0.1)" stroke="#3b82f6" stroke-width="2"/>
  <text x="110" y="160" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Claude Desktop</text>
  <text x="110" y="177" text-anchor="middle" font-size="11" fill="#6b7280">✓ 已接入</text>

  <!-- Future Platform -->
  <rect x="30" y="200" width="160" height="50" rx="10" fill="rgba(59,130,246,0.1)" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="110" y="225" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">未來平台</text>
  <text x="110" y="242" text-anchor="middle" font-size="11" fill="#9ca3af">可即插即用</text>

  <!-- ===== Center: MCP Server ===== -->
  <rect x="310" y="100" width="180" height="100" rx="14" fill="rgba(16,185,129,0.12)" stroke="#10b981" stroke-width="2.5"/>
  <text x="400" y="145" text-anchor="middle" font-size="18" font-weight="700" fill="#059669">MCP Server</text>
  <text x="400" y="170" text-anchor="middle" font-size="13" fill="#6b7280">一次開發</text>
  <text x="400" y="190" text-anchor="middle" font-size="13" fill="#6b7280">多端共用</text>

  <!-- Arrows from clients to MCP -->
  <line x1="190" y1="95" x2="305" y2="135" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowhead-blue)"/>
  <line x1="190" y1="160" x2="305" y2="145" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowhead-blue)"/>
  <line x1="190" y1="225" x2="305" y2="160" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-blue)"/>

  <!-- ===== Right: Backend Service ===== -->
  <!-- Label -->
  <text x="670" y="55" text-anchor="middle" font-size="13" font-weight="600" fill="#6b7280">後端服務</text>

  <!-- Backend -->
  <rect x="570" y="100" width="160" height="100" rx="12" fill="rgba(16,185,129,0.1)" stroke="#10b981" stroke-width="2"/>
  <text x="650" y="145" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">後端服務</text>
  <text x="650" y="170" text-anchor="middle" font-size="12" fill="#6b7280">Binance / CoinGlass</text>
  <text x="650" y="190" text-anchor="middle" font-size="12" fill="#6b7280">資料庫</text>

  <!-- Arrow from MCP to Backend -->
  <line x1="490" y1="150" x2="565" y2="150" stroke="#10b981" stroke-width="2" marker-end="url(#arrowhead-green)"/>

  <!-- Bottom annotation -->
  <rect x="230" y="258" width="340" height="32" rx="8" fill="rgba(16,185,129,0.08)" stroke="#a7f3d0" stroke-width="1"/>
  <text x="400" y="280" text-anchor="middle" font-size="13" font-weight="600" fill="#059669">同一個 MCP Server 被多個客戶端使用</text>
</svg>
